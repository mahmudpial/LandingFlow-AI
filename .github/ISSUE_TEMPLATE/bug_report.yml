name: Bug Report
description: Report a functional, UI/UX, or security issue in LandingFlow AI
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
