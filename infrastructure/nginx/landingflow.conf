server {
    listen 80;
    listen [::]:80;
    server_name landingflow.example.com;

    # Redirect all HTTP traffic to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name landingflow.example.com;

    # Managed by Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/landingflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landingflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Root serves compiled Vue 3 SPA assets
    root /var/www/landingflow-ai/frontend/dist;
    index index.html;

    client_max_body_size 3M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy Laravel API & Sanctum CSRF routes to PHP-FPM
    location ~ ^/(api|sanctum|storage|up) {
        root /var/www/landingflow-ai/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/landingflow-ai/backend/public/index.php;
            include fastcgi_params;
        }
    }

    # Vue Router SPA fallback (including /p/{slug} public landing pages)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block direct access to dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
