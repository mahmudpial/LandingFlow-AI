services:
  postgres:
    image: postgres:16-alpine
    container_name: landingflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-landingflow}
      POSTGRES_USER: ${DB_USERNAME:-landingflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-landingflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
